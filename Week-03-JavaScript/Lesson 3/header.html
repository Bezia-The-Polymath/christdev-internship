<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ChristDev Header</title>

    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ================= TOP INFORMATION BAR ================= -->

    <div class="top-bar">
      <div class="top-item">
        <i class="fas fa-phone-volume"></i>
        <span>+237 673 094 943</span>
      </div>

      <div class="top-item">
        <i class="fas fa-clock"></i>
        <span>Mon - Sat: 8:00 am to 6:00 pm</span>
      </div>

      <div class="top-item">
        <i class="fas fa-at"></i>
        <span>contact@christdev.com</span>
      </div>

      <div class="top-item">
        <i class="fas fa-envelope"></i>
        <span>P.O. Box 436 Buea, Cameroon</span>
      </div>

      <div class="top-item">
        <i class="fas fa-house"></i>
        <span>Buea, Cameroon</span>
      </div>
    </div>

    <!-- ================= MAIN HEADER ================= -->

    <header class="main-header">
      <!-- MAIN HEADER CONTENT -->
      <div class="header-container">
        <!-- LOGO -->
        <div class="logo">
          <img src="logo.jpg" alt="ChristDev Logo" />
        </div>

        <!-- ACTION BUTTONS -->
        <div class="header-buttons">
          <a href="#" class="header-button">
            <div class="button-icon">
              <i class="fab fa-whatsapp"></i>
            </div>

            <div class="button-text">
              <strong>WhatsApp</strong>
              <span>+237 673 094 943</span>
            </div>
          </a>

          <a href="#" class="header-button">
            <div class="button-icon">
              <i class="fas fa-headset"></i>
            </div>

            <div class="button-text">
              <strong>Talk to an Expert</strong>
              <span>Book Now!</span>
            </div>
          </a>
        </div>
      </div>

      <!-- ================= NAVIGATION MENU ================= -->

      <div class="container menu-container">
        <div class="menu">
          <a href="#">
            <span class="menu-item">About</span>
          </a>

          <a href="#">
            <span class="menu-item">Services</span>
          </a>

          <a href="#">
            <span class="menu-item">Contact</span>
          </a>

          <a href="#">
            <span class="menu-item">Blog</span>
          </a>

          <a href="#">
            <span class="menu-item">Home</span>
          </a>
        </div>
      </div>
    </header>
  </body>
</html>
