<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradients</title>
    <style>
      .rect {
        width: calc(100% - 100px);
        background-color: rgb(228, 215, 215);
        min-height: 100px;
        margin: 10px auto;
        box-shadow: 5px 5px 0px 0px black;
      }
      .r1 {
        background: linear-gradient(90deg, blue 20%, purple 50%, orange);
      }
      .r2 {
        background: radial-gradient(
          circle at top,
          blue 30%,
          purple 30% 50%,
          orange 50%
        );
        min-height: 400px;
      }
      .r3 {
        background: radial-gradient(circle at left, red, black);
      }
      .r4 {
        background: linear-gradient(90deg, red, black);
      }
      .r5 {
        background: url("Capture.PNG");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
      }
    </style>
  </head>
  <body>
    <div class="rect r1"></div>
    <div class="rect r2"></div>
    <div class="rect r3"></div>
    <div class="rect r4"></div>
    <div class="rect r5"></div>
    <div class="rect r6"></div>
    <div class="rect r7"></div>
    <div class="rect r8"></div>
  </body>
</html>
