<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Position</title>
    <style>
      .postioned-elements {
        position: relative;
        margin: 300px;
        background-color: aliceblue;
        min-height: 50vh;
      }
      .circle {
        width: 300px;
        border-radius: 50%;
        height: 300px;
        background: linear-gradient(black, purple);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: -100px;
        /* position: relative; */
        /* background-color: red;
        
        position: absolute;
        top: 50%;
        left: 50%; 
        transform: translate(-50%, -50%); */
      }
      /* .circle h1 {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      } */
      .circle.one {
        z-index: 3;
      }
      .circle.two {
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div class="postioned-elements">
      <div class="circle one">
        <h1>circle 1</h1>
      </div>

      <div class="circle two">
        <h1>circle 2</h1>
      </div>
      <div class="circle">
        <h1>circle 3</h1>
      </div>
    </div>
  </body>
</html>
