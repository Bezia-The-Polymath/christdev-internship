    <main>
      <br />
      <hr />
      <h1 class="head">Contact form</h1>
      <form method="get" class="card">
        <div class="input">
          <label for="name">Name:</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="John Doe"
            required
          />
        </div>
        <br />
        <div class="input">
          <label for="email">Email:</label>
          <input
            type="text"
            id="email"
            name="email"
            placeholder="johndoe@gmail.com"
            required
          />
        </div>
        <br />
        <div class="input">
          <label for="subject">Subject:</label><br>
          <textarea
            name="subject"
            id="subject"
            placeholder="Recruitment Opportunity"
            required
          ></textarea>
        </div>
        <br />
        <div class="input">
          <label for="">Message:</label><br>
          <textarea
            name="message"
            id="message"
            placeholder="I am writing to..."
            required
          ></textarea>
        </div>
        <br />
        <div class="input">
          <label for="reason">Reason for contact:</label><br>
          <textarea
            name="reason"
            id="reason"
            placeholder="I am writing to..."
            required
          ></textarea>
        </div>
        <br />
        <input type="submit" value="Submit" />
      </form>
    </main>
