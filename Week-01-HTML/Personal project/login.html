      <h2 class="head">Login Form</h2>
      <form method="post" class="card">
        <div>
          <label for="email">Email:</label>
          <input
            type="email"
            id="Email"
            name="name"
            placeholder="johndoe@gmail.com"
          />
        </div>
        <br />
        <div>
          <label for="password">Password:</label>
          <input
            type="password"
            id="Password"
            name="password"
            placeholder="aJ49%xVf&a2@"
          />
        </div>
        <br />
        <button type="submit">Submit</button>
        <p>
          Don't have an account yet?<br /><br /><b
            ><a href="index.html#signup">Create an account</a></b
          >
        </p>
      </form>
