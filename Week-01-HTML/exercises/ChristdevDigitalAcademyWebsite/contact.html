<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christdev Digital Academy</title>
    <link rel="icon" href="../../assets/nameontop.svg" type="image/png" />
  </head>
  <body>
    <img
      src="../../assets/nameontop.svg"
      alt="christdevlogo"
      width="100"
      align="right"
    />

    <a href="homepage.html" rel="noreferrer">Homepage</a>
    <a href="course.html" rel="noreferrer">Course</a>
    <a href="contact.html" rel="noreferrer">Contact</a>
    <br />
    <h1>Our Contact</h1>
    <form action="" method="get">
      <div class="input">
        <label for="">Full Name:</label>
        <input
          type="text"
          id="FullName"
          name="fullname"
          minlength="3"
          placeholder="Enter your full name"
        />
      </div>
      <br />
      <div class="input">
        <label for="">Email:</label>
        <input
          type="text"
          id="Email"
          name="Email"
          minlength="3"
          placeholder="Enter your Email"
        />
      </div>
      <br />
      <div class="input">
        <label for="">Phone:</label>
        <input
          type="text"
          id="Phone"
          name="phone"
          minlength="9"
          maxlength="13"
          placeholder="Enter your phone number"
        />
      </div>
      <br />

      <div class="textarea">
        <label for="">What do you want from us?</label>
        <textarea
          id="Purpose"
          name="purpose"
          minlength="10"
          placeholder="Enter your purpose"
        >
        </textarea>
      </div>
      <br />
      <input type="submit" value="Submit" />
      <br /><br />
    </form>
  </body>
</html>
