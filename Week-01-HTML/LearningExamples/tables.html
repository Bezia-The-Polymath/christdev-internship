<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h1>Tables</h1>
    <table border="1">
        <thead>
            <th>Course</th>
            <th>Duration</th>
            <th>Instructor</th>
            <th>Price</th>
            <th>Enrollment</th>
        </thead>
        <tr>
            <td rowspan="2">HTML & CSS</td>
            <td>6 weeks</td>
            <td>John Doe</td>
            <td>$199</td>
            <td>Open</td>
        </tr>
        <tr>
            <!-- <td>JavaScript</td> -->
            <td colspan="1">8 weeks</td>
            <td>Jane Smith</td>
            <td>$249</td>
            <td>Open</td>
        </tr>
        <tr>
            <td>Python</td>
            <td>10 weeks</td>
            <td>Mike Johnson</td>
            <td>$299</td>
            <td>Closed</td>
        </tr>
    </table>
</body>
</html>
